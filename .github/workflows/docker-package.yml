name: Dockerfile package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: List out available images
        id: list
        run: |
          images=$(ls ./container_images/)
          for image in "${images[@]}"; do
            echo docker-images=$image >> "GITHUB_OUTPUT"
          done
      - name: Display images list
        run: |
          echo "${{ steps.list.outputs.docker-images }}"

      - name: Login to docker hub
        id: login
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build docker image for x86
        id: build
        run: |
          docker build ./container_images/terraform/. -t arthur210/terraform_runner:3.0.0 --platform linux/amd64
          docker image ls

#      - name: Publish docker image for x86
